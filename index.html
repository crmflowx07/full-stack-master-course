react:`function TaskForm(){
  const [title,setTitle]=React.useState("");
  const [saving,setSaving]=React.useState(false);
  async function submit(e){
    e.preventDefault();
    setSaving(true);
    try{
      const r=await fetch("/api/tasks",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({title})
      });
      if(!r.ok) throw new Error("Save failed");
      setTitle("");
    } finally { setSaving(false); }
  }
  return <form onSubmit={submit}>
    <input value={title} onChange={e=>setTitle(e.target.value)} />
    <button disabled={saving}>{saving?"Saving…":"Add task"}</button>
  </form>
}`,

  let left=0,right=nums.length-1;
  while(left<=right){
    const mid=Math.floor((left+right)/2);
    if(nums[mid]===target) return mid;

function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
function App(){
 const [idx,setIdx]=useState(0),[tab,setTab]=useState("learn"),[query,setQuery]=useState("");
 const [done,setDone]=useState(()=>load(STORAGE+"-done",{})),[book,setBook]=useState(()=>load(STORAGE+"-book",{})),[notes,setNotes]=useState(()=>load(STORAGE+"-notes",{}));

 const [answers,setAnswers]=useState({});
 const p=phases[idx], key=p[2], q=quizzes[key], progress=Math.round(Object.values(done).filter(Boolean).length/phases.length*100);
 useEffect(()=>localStorage.setItem(STORAGE+"-done",JSON.stringify(done)),[done]);useEffect(()=>localStorage.setItem(STORAGE+"-book",JSON.stringify(book)),[book]);useEffect(()=>localStorage.setItem(STORAGE+"-notes",JSON.stringify(notes)),[notes]);
 useEffect(()=>{localStorage.setItem(STORAGE+"-theme",theme);const m=matchMedia("(prefers-color-scheme: light)");const apply=()=>document.documentElement.dataset.theme=theme==="system"?(m.matches?"light":"dark"):theme;apply();m.addEventListener?.("change",apply);return()=>m.removeEventListener?.("change",apply)},[theme]);

 const uses=p[5], concepts=p[4], skills=p[6];
 const practice=["Read the definition and rewrite it in your own words.","Type the code example manually; do not copy it first.","Change at least three inputs/assumptions and predict the output.","Create one deliberate bug and diagnose it with the correct tool.","Implement a small feature using the concept in a separate Git branch.","Write a README note explaining one tradeoff and one common mistake.","Commit the finished lab with a meaningful Conventional Commit message."];

  <header className="top"><div className="brand"><div className="brand-mark">FS</div><div><b>FULL STACK MASTER ACADEMY</b><small>ULTRA V4 • LEARN → BUILD → SHIP</small></div></div>
  <div className="search"><span>⌕</span><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search React, JWT, SQL, Docker, Git…"/>{query&&<div className="search-results">{results.map(({x,i})=><button key={x[0]} onClick={()=>{setIdx(i);setQuery("");setTab("learn")}}><small>Phase {x[0]}</small><b>{x[1]}</b></button>)}</div>}</div>

  {tab==="learn"&&<div className="content"><div>
   <section className="section panel"><div className="tag">01 • Definition</div><h2>What is {p[1]}?</h2><p>{p[3]}</p></section>
   <div className="twocol"><section className="section panel"><div className="tag">02 • Real-world uses</div><h2>Where you use it</h2><ul className="check">{uses.map(x=><li>{x}</li>)}</ul></section><section className="section panel"><div className="tag">03 • Mastery targets</div><h2>What you must be able to do</h2><ul className="check">{skills.map(x=><li>{x}</li>)}</ul></section></div>
   <section className="section"><div className="tag">04 • Deep concepts</div><h2>Concept map</h2><div className="concepts">{concepts.map((x,i)=><article className="concept"><b>{String(i+1).padStart(2,"0")} — {x}</b><p>Learn the definition, syntax, tradeoffs, failure modes and how this topic connects to the rest of a production full-stack system.</p></article>)}</div></section>
   <section className="section"><div className="tag">05 • Working code</div><h2>Type it, change it, break it, fix it</h2><CodeBlock title={p[1]+" example"} code={CODE[key]}/></section>
   <section className="section panel"><div className="tag">06 • Engineering mindset</div><h2>Production checklist</h2><ul className="check"><li>Handle loading, empty, success and failure states.</li><li>Validate input at the correct trust boundary.</li><li>Keep responsibilities separated and names explicit.</li><li>Make behavior observable with errors/logs/tests where appropriate.</li><li>Document setup, assumptions and tradeoffs in README.</li><li>Commit in small reviewable steps instead of one giant commit.</li></ul></section>
  </div><aside className="rail"><div className="panel"><div className="tag">Phase project</div><h3>{p[7]}</h3><p>This project is your proof of skill. Put it in GitHub with a professional README, screenshots, setup instructions and a short architecture explanation.</p></div><div className="panel"><div className="tag">Lesson checklist</div>{["I can define it without notes","I typed the example","I changed and broke the code","I finished the lab","I can explain one tradeoff","I committed my work"].map(x=><label><input type="checkbox"/>{x}</label>)}</div></aside></div>}
  {tab==="practice"&&<div className="single"><div className="banner"><span>PRACTICE MODE</span><h2>Stop reading. Start building.</h2><p>Finish the steps in a real repository. Do not mark the phase complete until you can reproduce the important parts without following a tutorial line-by-line.</p></div><section className="section"><div className="tag">Guided lab</div><h2>Seven-step deliberate practice loop</h2><div className="steps">{practice.map(x=><div>{x}</div>)}</div></section><section className="section panel"><div className="tag">Debugging drill</div><h2>Break → Observe → Isolate → Fix → Prevent</h2><p>Introduce one realistic bug. Capture the symptom, identify the failing layer, use the right debugging tool, write the root cause, then add validation/test/logging so the same class of failure is easier to detect next time.</p></section></div>}
  {tab==="quiz"&&<div className="single"><div className="banner"><span>KNOWLEDGE CHECK</span><h2>Can you explain it without the tutorial?</h2><p>Answer the quiz, then speak through the interview prompts aloud.</p></div><div className="quiz"><div className="q"><h3>{q[0]}</h3><div className="opts">{[q[1],q[2]].map((o,i)=><button className={answers[key]===i?(i===0?"correct":"wrong"):""} onClick={()=>setAnswers({...answers,[key]:i})}>{o}</button>)}</div>{answers[key]!=null&&<div className="feedback">{answers[key]===0?"Correct — now explain why in your own words.":"Not quite — revisit the lesson definition and concept map."}</div>}</div><div className="q"><h3>Interview prompts</h3><ul className="check"><li>Define {p[1]} in 60 seconds.</li><li>Give one real production use case.</li><li>Explain one common failure or misuse.</li><li>Describe one tradeoff or alternative.</li><li>Show how this phase connects to frontend, backend, database or deployment.</li></ul></div></div></div>}
  {tab==="project"&&<div className="single"><div className="banner"><span>PHASE PROJECT</span><h2>{p[7]}</h2><p>Build evidence, not just notes.</p></div><section className="section panel"><div className="tag">Definition of done</div><h2>Your project must include</h2><ul className="check"><li>Clear feature list and acceptance criteria.</li><li>GitHub repository with meaningful commit history.</li><li>Professional README with setup, architecture and screenshots.</li><li>Responsive/error/security QA appropriate to the phase.</li><li>At least one debugging note describing a bug and root cause.</li><li>A 3–5 minute walkthrough explaining architecture and tradeoffs.</li></ul></section></div>}
  {tab==="notes"&&<div className="single"><div className="banner"><span>PERSONAL NOTES</span><h2>Turn knowledge into your own words.</h2><p>Saved locally in this browser.</p></div><textarea className="notes" value={notes[key]||""} onChange={e=>setNotes({...notes,[key]:e.target.value})} placeholder={"Definition in my own words…\nImportant syntax…\nMistakes I made…\nQuestions to revisit…\nProject improvements…"}/></div>}
  <footer className="footer">Full Stack Master Academy ULTRA V4 • 20 phases • Light/Dark/System themes • progress, notes, bookmarks, labs, quizzes and production projects.</footer>
  </main></div></div>
}
function CodeBlock({title,code}){const [copied,setCopied]=useState(false);return <div className="code"><div className="codehead"><b>{title}</b><button onClick={()=>{navigator.clipboard?.writeText(code);setCopied(true);setTimeout(()=>setCopied(false),1000)}}>{copied?"Copied ✓":"Copy"}</button></div><pre><code>{code}</code></pre><p>Study method: type it manually → run it → change it → deliberately break it → diagnose the error → fix it → commit the result.</p></div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
